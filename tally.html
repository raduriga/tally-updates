<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Acorn">
<title>Acorn</title>
<meta name="tally-version" content="202611041739">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Acorn: a local-first budget tracker with wallets, transfers, budgets, Revolut import and Apple Pay capture, styled after the Gruvbox Glass desktop.">
<style>
/* Layout: "glass instrument panel" - smoky Gruvbox glass chips over a warm ground; serif-italic titles like the
   Rainmeter widgets, monospace for every figure and label like the YASB bar. System fonts only, so it works offline. */
:root{
  --ground:#f9f5d7; --glass:rgba(235,219,178,.55); --glass-2:rgba(213,196,161,.45); --glass-hi:rgba(213,196,161,.75);
  --line:rgba(60,56,54,.10); --fg:#3c3836; --dim:#7c6f64; --faint:#928374;
  --gold:#b57614; --on-gold:#fbf1c7; --green:#79740e; --red:#9d0006; --blue:#076678; --orange:#af3a03;
  --aqua:#427b58; --purple:#8f3f71; --yellow:#b57614; --gray:#7c6f64;
  --glow-a:rgba(215,153,33,.16); --glow-b:rgba(104,157,106,.12); --shadow:0 10px 30px rgba(60,56,54,.12);
  --serif:ui-serif,"New York","Sitka Display",Georgia,serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#1d2021; --glass:rgba(60,56,54,.45); --glass-2:rgba(80,73,69,.42); --glass-hi:rgba(80,73,69,.72);
  --line:rgba(235,219,178,.08); --fg:#ebdbb2; --dim:#a89984; --faint:#928374;
  --gold:#fabd2f; --on-gold:#1d2021; --green:#b8bb26; --red:#fb4934; --blue:#83a598; --orange:#fe8019;
  --aqua:#8ec07c; --purple:#d3869b; --yellow:#fabd2f; --gray:#a89984;
  --glow-a:rgba(215,153,33,.13); --glow-b:rgba(142,192,124,.07); --shadow:0 12px 34px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#1d2021; --glass:rgba(60,56,54,.45); --glass-2:rgba(80,73,69,.42); --glass-hi:rgba(80,73,69,.72);
  --line:rgba(235,219,178,.08); --fg:#ebdbb2; --dim:#a89984; --faint:#928374;
  --gold:#fabd2f; --on-gold:#1d2021; --green:#b8bb26; --red:#fb4934; --blue:#83a598; --orange:#fe8019;
  --aqua:#8ec07c; --purple:#d3869b; --yellow:#fabd2f; --gray:#a89984;
  --glow-a:rgba(215,153,33,.13); --glow-b:rgba(142,192,124,.07); --shadow:0 12px 34px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
  background:radial-gradient(120% 70% at 15% -10%,var(--glow-a),transparent 60%),radial-gradient(90% 60% at 110% 105%,var(--glow-b),transparent 60%),var(--ground);
  background-attachment:fixed;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--ground)}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tnum,.amt,.v,.net,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* The app has no host padding, so the page itself starts below the status bar; otherwise the sticky header slides over the first card. */
#app{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
html{touch-action:manipulation} /* no double-tap zoom */
.screen{display:none;flex-direction:column}
.screen.active{display:flex}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--ground) 78%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;min-height:56px}
header.bar h1{font-family:var(--serif);font-style:italic;font-weight:600;font-size:26px;letter-spacing:-.01em}
.spacer{flex:1}
.iconbtn{min-width:36px;height:34px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--glass-2);display:grid;place-items:center;
  font-family:var(--mono);font-size:13px;font-weight:600;line-height:1;padding:0 10px;color:var(--fg)}
select.iconbtn{appearance:none;-webkit-appearance:none;max-width:46vw}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.hero{padding:18px 16px 16px}
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.net{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-top:6px}
.rows{display:flex;flex-direction:column}
.rows>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;min-width:0;background:none;border:0;width:100%;text-align:left;color:inherit}
.li .ic{width:36px;height:36px;border-radius:var(--r-sm);flex:none;display:grid;place-items:center;font-size:17px;
  background:color-mix(in srgb,var(--c,var(--gray)) 20%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,var(--gray)) 30%,transparent)}
.li .mid{min-width:0;flex:1}
.li .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.li .meta{color:var(--dim);font-family:var(--mono);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:1px}
.li .amt{font-weight:700;font-size:14px;white-space:nowrap}
.amt.income{color:var(--green)}.amt.expense{color:var(--fg)}.amt.transfer{color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .k{font-family:var(--mono);color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.stat .v{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.sectitle{display:flex;align-items:baseline;gap:10px;margin:8px 2px -2px}
.sectitle h2{font-family:var(--serif);font-style:italic;font-size:19px;font-weight:600}
.sectitle .link{margin-left:auto;color:var(--gold);font-family:var(--mono);font-weight:700;font-size:12px;background:none;border:0;padding:0}
.day{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:6px 2px -6px;display:flex}
.day span:last-child{margin-left:auto}
.bar-track{height:6px;border-radius:99px;background:var(--glass-2);overflow:hidden;margin-top:8px}
.bar-fill{height:100%;border-radius:99px;background:var(--c,var(--gold))}
.bar-fill.warn{background:var(--orange)}.bar-fill.crit{background:var(--red)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--glass-2);color:var(--dim)}
.pill.up{color:var(--red)}.pill.down{color:var(--green)}
nav.tabs{position:fixed;z-index:35;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));
  background:var(--glass-hi);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);border-radius:16px;
  display:flex;padding:4px;box-shadow:var(--shadow)}
nav.tabs button{flex:1;background:none;border:0;border-radius:11px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--faint);
  font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.04em}
nav.tabs button .g{font-size:18px;line-height:1.1}
nav.tabs button.on{color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.fab{position:fixed;z-index:36;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));
  width:54px;height:54px;border-radius:16px;background:var(--gold);color:var(--on-gold);border:0;font-size:28px;font-weight:300;display:grid;place-items:center;
  box-shadow:0 10px 26px color-mix(in srgb,var(--gold) 38%,transparent)}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(29,32,33,.5);display:none;align-items:flex-end}
.scrim.open{display:flex}
.sheet{background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);border-bottom:0;
  width:100%;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:99px;background:var(--glass-hi);margin:0 auto 12px}
@media (min-width:640px){.scrim{align-items:center;justify-content:center}.sheet{max-width:520px;border-radius:20px;border-bottom:1px solid var(--line)}main{max-width:640px;margin:0 auto;width:100%}}
.sheet h2{font-family:var(--serif);font-style:italic;font-size:22px;font-weight:600;margin-bottom:14px;padding-right:44px}
.sheet{position:relative;transition:transform .2s ease}
.sheet.dragging{transition:none}
.sheet .x{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));width:34px;height:34px;border-radius:9px;border:0;background:var(--glass-2);color:var(--dim);font-size:15px;font-weight:700;display:grid;place-items:center;z-index:1}
.seg{display:flex;background:var(--glass-2);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--dim)}
.seg button.on{background:var(--glass-hi);color:var(--fg)}
.seg button.on[data-k="expense"]{color:var(--red)}.seg button.on[data-k="income"]{color:var(--green)}.seg button.on[data-k="transfer"]{color:var(--blue)}
label.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.fld input,.fld select,.fld textarea{font-family:var(--sans);font-size:16px;letter-spacing:0;text-transform:none;color:var(--fg);background:var(--glass-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;width:100%}
.btns{display:flex;gap:10px;margin-top:4px}
.btn{flex:1;border:0;border-radius:10px;padding:13px;font-family:var(--mono);font-weight:700;font-size:14px}
.btn.primary{background:var(--gold);color:var(--on-gold)}
.btn.ghost{background:var(--glass-2);color:var(--fg)}
.btn.danger{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.empty{text-align:center;color:var(--dim);padding:30px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty .big{font-size:34px}
.mini{font-size:12.5px;color:var(--faint)}
.catgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:12px}
.catgrid button{background:var(--glass-2);border:1px solid transparent;border-radius:10px;padding:8px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--dim);min-width:0}
.catgrid button span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catgrid button.on{border-color:var(--c,var(--gold));color:var(--fg);background:color-mix(in srgb,var(--c,var(--gold)) 20%,transparent)}
.catgrid button .g{font-size:18px}
.menu .li{padding:12px 0}
.searchbox{font-family:var(--sans);font-size:15px;color:var(--fg);background:var(--glass-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav b{font-family:var(--mono);font-size:12.5px;min-width:74px;text-align:center}
code,.code{font-family:var(--mono);font-size:11.5px;background:var(--glass-2);border-radius:5px;padding:2px 5px;word-break:break-all}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--ground);
  padding:10px 14px;border-radius:10px;font-family:var(--mono);font-weight:600;font-size:12px;box-shadow:var(--shadow);max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center}
#toast .act{color:var(--ground);background:color-mix(in srgb,var(--ground) 18%,transparent);border:0;border-radius:6px;padding:5px 9px;font-family:var(--mono);font-weight:800;font-size:12px;flex:none}
a{color:var(--gold)}
/* amount entry */
.amount-display{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:-.03em;text-align:center;padding:6px 0 2px;min-height:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amount-display .cur{color:var(--faint);font-size:20px;margin-left:6px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 12px}
.keypad button{background:var(--glass-2);border:0;border-radius:10px;padding:12px 0;font-family:var(--mono);font-size:20px;font-weight:600;color:var(--fg)}
.keypad button:active{background:var(--glass-hi)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--glass-2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--fg);white-space:nowrap}
.chip .g{margin-right:4px}
/* swipe rows */
.swipe{position:relative;overflow:hidden}
/* The action labels sit under the row and only show while it's being dragged; the row is opaque then so they never overlap its text. */
.swipe .under{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.08em;visibility:hidden}
.swipe .under .l{color:var(--blue)}.swipe .under .r{color:var(--red)}
.swipe .li{position:relative;background:transparent;transition:transform .18s ease}
.swipe.dragging .under{visibility:visible}
.swipe.dragging .li{transition:none;background:var(--ground)}
.swipe.dragging{background:var(--glass-2)}
/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--mono);font-size:9.5px;fill:var(--faint)}
.legend{display:flex;gap:12px;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.swatches button{width:30px;height:30px;border-radius:8px;border:2px solid transparent;background:var(--c)}
.swatches button.on{border-color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <section class="screen active" data-screen="overview">
    <header class="bar"><h1>Overview</h1><span class="spacer"></span>
      <div class="monthnav"><button class="iconbtn" data-mon="-1" aria-label="Previous month">‹</button><b id="ov-month" class="tnum"></b><button class="iconbtn" data-mon="1" aria-label="Next month">›</button></div></header>
    <main id="ov"></main>
  </section>
  <section class="screen" data-screen="timeline">
    <header class="bar"><h1>Timeline</h1><span class="spacer"></span><select id="tl-wallet" class="iconbtn" aria-label="Wallet filter"></select></header>
    <main><input id="tl-search" class="searchbox" type="search" placeholder="Search notes, categories, labels" aria-label="Search"><div id="tl"></div></main>
  </section>
  <section class="screen" data-screen="budgets">
    <header class="bar"><h1>Budgets</h1><span class="spacer"></span><button class="iconbtn" id="add-budget">+ Budget</button></header>
    <main id="bd"></main>
  </section>
  <section class="screen" data-screen="wallets">
    <header class="bar"><h1>Money</h1><span class="spacer"></span><button class="iconbtn" id="add-goal">+ Goal</button><button class="iconbtn" id="add-wallet">+ Wallet</button></header>
    <main id="wl"></main>
  </section>
  <section class="screen" data-screen="more">
    <header class="bar"><h1>More</h1></header>
    <main>
      <div class="eyebrow" style="margin:4px 2px -4px">Money</div>
      <div class="card menu rows">
        <button class="li" id="m-categories" style="--c:var(--purple)"><span class="ic">🏷️</span><span class="mid"><span class="ttl">Categories</span><span class="meta">Add, rename, recolour, hide or merge</span></span></button>
        <button class="li" id="m-recurring" style="--c:var(--aqua)"><span class="ic">🔁</span><span class="mid"><span class="ttl">Scheduled &amp; recurring</span></span></button>
        <button class="li" id="m-rates" style="--c:var(--gold)"><span class="ic">💱</span><span class="mid"><span class="ttl">Currencies &amp; rates</span></span></button>
      </div>
      <div class="eyebrow" style="margin:4px 2px -4px">Capture</div>
      <div class="card menu rows">
        <button class="li" id="m-revolut" style="--c:var(--blue)"><span class="ic">📄</span><span class="mid"><span class="ttl">Import bank CSV</span><span class="meta">Revolut statement or any bank CSV</span></span></button>
        <button class="li" id="m-bank" style="--c:var(--blue)" hidden><span class="ic">🏦</span><span class="mid"><span class="ttl">Bank sync</span><span class="meta" id="bank-meta">Every Revolut payment, automatically</span></span></button>
        <button class="li" id="m-shortcut" style="--c:var(--green)"><span class="ic">📲</span><span class="mid"><span class="ttl">Apple Pay auto-capture</span><span class="meta">Shortcut logs each card tap</span></span></button>
      </div>
      <div class="eyebrow" style="margin:4px 2px -4px">App</div>
      <div class="card menu rows">
        <label class="li" id="m-lock" style="--c:var(--orange)" hidden><span class="ic">🔒</span><span class="mid"><span class="ttl">Face ID lock</span><span class="meta">After 1 minute away</span></span><input type="checkbox" id="lock-toggle" style="width:20px;height:20px;accent-color:var(--gold)"></label>
        <button class="li" id="m-theme" style="--c:var(--gray)"><span class="ic">🌓</span><span class="mid"><span class="ttl">Theme</span><span class="meta" id="theme-meta">Follows your iPhone</span></span></button>
        <button class="li" id="m-export" style="--c:var(--aqua)"><span class="ic">💾</span><span class="mid"><span class="ttl">Back up</span><span class="meta">Save a copy of everything</span></span></button>
        <button class="li" id="m-import" style="--c:var(--blue)"><span class="ic">♻️</span><span class="mid"><span class="ttl">Restore backup</span></span></button>
        <button class="li" id="m-reset" style="--c:var(--red)"><span class="ic">🗑️</span><span class="mid"><span class="ttl">Erase all data</span></span></button>
      </div>
      <p class="mini" id="sync-note">Everything is stored only in this browser. No account, no server. Back up regularly.</p>
    </main>
  </section>
</div>
<button class="fab" id="fab" aria-label="Add transaction">+</button>
<nav class="tabs">
  <button data-go="overview" class="on"><span class="g">◔</span>OVERVIEW</button>
  <button data-go="timeline"><span class="g">≡</span>TIMELINE</button>
  <button data-go="budgets"><span class="g">◎</span>BUDGETS</button>
  <button data-go="wallets"><span class="g">▤</span>MONEY</button>
  <button data-go="more"><span class="g">⋯</span>MORE</button>
</nav>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<input type="file" id="file-csv" accept=".csv,text/csv,text/plain" hidden>
<input type="file" id="file-json" accept=".json,application/json" hidden>

<script id="core">
// ---- core: pure data logic (no DOM). Money is integer cents; dates are local "YYYY-MM-DD". ----
// shortcut: cents assumes 2-decimal currencies (JPY/HUF shown x100 off), add per-currency exponents if needed.
const SYS = { transfer: "transfer", adjust: "adjust" };
// color is a Gruvbox accent name (CSS var), so categories follow light/dark like the rest of the app.
const COLORS = ["green", "yellow", "orange", "red", "purple", "blue", "aqua", "gray"];
const DEFAULT_CATS = [
  ["groceries","Groceries","🛒","expense","green"],["restaurants","Restaurants","🍽️","expense","orange"],["coffee","Coffee","☕","expense","yellow"],
  ["transport","Transport","🚌","expense","blue"],["shopping","Shopping","🛍️","expense","purple"],["bills","Bills","🧾","expense","aqua"],
  ["home","Rent & home","🏠","expense","yellow"],["health","Health","💊","expense","red"],["fun","Entertainment","🎬","expense","purple"],
  ["travel","Travel","✈️","expense","blue"],["subs","Subscriptions","🔁","expense","aqua"],["cash","Cash","🏧","expense","green"],
  ["gifts","Gifts","🎁","expense","red"],["fees","Fees","🏦","expense","gray"],["other","Other","📦","expense","gray"],
  ["salary","Salary","💼","income","green"],["refunds","Refunds","↩️","income","aqua"],["interest","Interest","📈","income","yellow"],
  ["giftsin","Gifts received","🎉","income","purple"],["otherin","Other income","💰","income","green"],
  [SYS.transfer,"Transfer","⇄","system","blue"],[SYS.adjust,"Balance adjustment","⚖️","system","gray"],
].map(([id,name,icon,type,color]) => ({ id, name, icon, type, color }));
// Older saves have no colors; fill them in from the defaults without touching anything else.
function upgradeDb(db){
  const byId = Object.fromEntries(DEFAULT_CATS.map(c => [c.id, c]));
  for (const c of db.categories) if (!c.color) c.color = (byId[c.id] && byId[c.id].color) || "gray";
  for (const c of DEFAULT_CATS) if (c.type === "system" && !db.categories.some(x => x.id === c.id)) db.categories.push({ ...c });
  // Wallet kind: "savings" never counts as spendable. Revolut's savings show up as "Deposit"/"Savings" products.
  for (const w of db.wallets) if (!w.kind) w.kind = /deposit|savings|vault|pocket/i.test(w.name) ? "savings" : w.type === "cash" ? "cash" : "account";
  db.goals = db.goals || [];
  db.potLinks = db.potLinks || {};
  return db;
}

function emptyDb(){
  return { v: 1, base: "EUR", rates: {}, wallets: [], categories: DEFAULT_CATS.map(c => ({ ...c })),
    transactions: [], templates: [], budgets: [], cardMap: {}, goals: [], potLinks: {} };
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function p2(x){ return String(x).padStart(2, "0"); }
function today(d = new Date()){ return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
function ymOf(date){ return date.slice(0, 7); }
function shiftYm(ym, n){ let [y, m] = ym.split("-").map(Number); m += n; while (m < 1){ m += 12; y--; } while (m > 12){ m -= 12; y++; } return y + "-" + p2(m); }

function parseAmount(s){
  if (s == null) return null;
  s = String(s).replace(/["\s ]/g, "").replace(/[^\d.,()+-]/g, "");
  if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1, -1); }
  if (s[0] === "-"){ neg = true; s = s.slice(1); } else if (s[0] === "+") s = s.slice(1);
  const hasC = s.includes(","), hasD = s.includes(".");
  if (hasC && hasD){ if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g, "").replace(",", "."); else s = s.replace(/,/g, ""); }
  else if (hasC){ if (/,\d{1,2}$/.test(s)) s = s.replace(",", "."); else s = s.replace(/,/g, ""); }
  const n = parseFloat(s);
  if (isNaN(n)) return null;
  return neg ? -n : n;
}
function toCents(s){ const n = typeof s === "number" ? s : parseAmount(s); return n == null ? null : Math.round(n * 100); }
// Prefixed dollars come before "$"; "kr" is left out because SEK, NOK and DKK all use it.
const SYMBOLS = [["US$","USD"],["HK$","HKD"],["NZ$","NZD"],["R$","BRL"],["A$","AUD"],["C$","CAD"],["S$","SGD"],["€","EUR"],["£","GBP"],["$","USD"],
  ["¥","JPY"],["₹","INR"],["₩","KRW"],["₺","TRY"],["₪","ILS"],["₱","PHP"],["฿","THB"],["kč","CZK"],["zł","PLN"],["lei","RON"],["ft","HUF"],["лв","BGN"],["chf","CHF"]];
function currencyFromText(s, fallback){
  s = String(s || "");
  const m = s.match(/\b([A-Z]{3})\b/); if (m) return m[1];
  const low = s.toLowerCase();
  for (const [sym, code] of SYMBOLS) if (low.includes(sym.toLowerCase())) return code;
  return fallback;
}
function rate(db, cur){ return cur === db.base ? 1 : (db.rates[cur] || 1); } // 1 unit of cur = rate base units
function convert(db, cents, from, to){ return from === to ? cents : Math.round(cents * rate(db, from) / rate(db, to)); }
function hasRate(db, cur){ return cur === db.base || db.rates[cur] > 0; }
// A foreign amount in the wallet's currency, converted at today's rate and kept as `original` (Spendee: customCurrencyValue).
// shortcut: uses the latest rate, not the rate on the payment's date; fine for same-day captures, off by a little for old CSV rows.
function inWalletCurrency(db, cents, cur, w){
  if (!cur || !w || cur === w.currency) return { amount: cents };
  const original = { amount: cents, currency: cur };
  return hasRate(db, cur) && hasRate(db, w.currency) ? { amount: convert(db, cents, cur, w.currency), original }
    : { amount: cents, original, unconverted: true };
}
// Frankfurter (ECB) feed for db.base: {base, date, rates: {CZK: 24.34, ...}} as units per 1 base. Currencies it lacks keep manual rates.
function applyRates(db, feed){
  if (!feed || feed.base !== db.base || !feed.rates || typeof feed.rates !== "object") return false;
  const auto = [];
  for (const [cur, perBase] of Object.entries(feed.rates)) if (/^[A-Z]{3}$/.test(cur) && perBase > 0){ db.rates[cur] = 1 / perBase; auto.push(cur); }
  db.ratesDate = String(feed.date || "").slice(0, 10); db.autoRates = auto;
  return auto.length > 0;
}

function wallet(db, id){ return db.wallets.find(w => w.id === id); }
function category(db, id){ return db.categories.find(c => c.id === id) || { id, name: id, icon: "📦", type: "expense", color: "gray" }; }
function txKind(t){ return t.category === SYS.transfer ? "transfer" : t.amount < 0 ? "expense" : "income"; }
function counts(t){ return t.countInOverview !== false && t.category !== SYS.transfer && t.category !== SYS.adjust; }
function txBase(db, t){ const w = wallet(db, t.walletId); return convert(db, t.amount, w ? w.currency : db.base, db.base); }

function walletBalance(db, wid, asOf = today()){
  const w = wallet(db, wid); if (!w) return 0;
  return db.transactions.reduce((s, t) => t.walletId === wid && t.date <= asOf ? s + t.amount : s, w.startingBalance || 0);
}
function totalBalance(db, asOf, filter = () => true){ return db.wallets.filter(w => !w.hidden && filter(w)).reduce((s, w) => s + convert(db, walletBalance(db, w.id, asOf), w.currency, db.base), 0); }
const isSavings = w => w.kind === "savings";
function spendableBalance(db, asOf){ return totalBalance(db, asOf, w => !isSavings(w)); }
function savingsBalance(db, asOf){ return totalBalance(db, asOf, isSavings); }
function monthTxs(db, ym){ return db.transactions.filter(t => ymOf(t.date) === ym && t.date <= today() && counts(t)); }
function monthFlow(db, ym){
  let income = 0, expense = 0;
  for (const t of monthTxs(db, ym)){ const v = txBase(db, t); if (v > 0) income += v; else expense -= v; }
  return { income, expense, net: income - expense };
}
function categorySpend(db, ym){
  const by = {};
  for (const t of monthTxs(db, ym)){ const v = txBase(db, t); if (v < 0) by[t.category] = (by[t.category] || 0) - v; }
  return Object.entries(by).map(([category, cents]) => ({ category, cents })).sort((a, b) => b.cents - a.cents);
}
function budgetSpent(db, b, ym){
  return monthTxs(db, ym).reduce((s, t) => {
    if (b.categories.length && !b.categories.includes(t.category)) return s;
    if (b.walletIds && b.walletIds.length && !b.walletIds.includes(t.walletId)) return s;
    const v = convert(db, txBase(db, t), db.base, b.currency || db.base);
    return v < 0 ? s - v : s;
  }, 0);
}

function addTx(db, t){
  const tx = { id: uid(), note: "", labels: [], countInOverview: true, source: "manual", ...t };
  db.transactions.push(tx); return tx;
}
// A transfer is two linked transactions, like Spendee's linkedTransactionPath pair.
function addTransfer(db, fromId, toId, cents, date, note = "", toCents){
  const from = wallet(db, fromId), to = wallet(db, toId);
  const a = addTx(db, { walletId: fromId, amount: -Math.abs(cents), category: SYS.transfer, date, note });
  const b = addTx(db, { walletId: toId, amount: toCents != null ? Math.abs(toCents) : convert(db, Math.abs(cents), from.currency, to.currency), category: SYS.transfer, date, note });
  a.linkedId = b.id; b.linkedId = a.id;
  return [a, b];
}
function deleteTx(db, id){
  const t = db.transactions.find(x => x.id === id); if (!t) return;
  db.transactions = db.transactions.filter(x => x.id !== id && x.id !== t.linkedId);
}
function adjustBalance(db, wid, targetCents, date = today()){
  const diff = targetCents - walletBalance(db, wid, date);
  if (!diff) return null;
  return addTx(db, { walletId: wid, amount: diff, category: SYS.adjust, date, countInOverview: false, note: "Balance adjustment" });
}
function nextDate(date, repeat){
  const [y, m, d] = date.split("-").map(Number);
  if (repeat === "daily" || repeat === "weekly" || repeat === "biweekly"){
    const dt = new Date(y, m - 1, d + ({ daily: 1, weekly: 7, biweekly: 14 })[repeat]); return today(dt);
  }
  const add = ({ monthly: 1, quarterly: 3, yearly: 12 })[repeat];
  let nm = m - 1 + add, ny = y + Math.floor(nm / 12); nm %= 12;
  const last = new Date(ny, nm + 1, 0).getDate();
  return ny + "-" + p2(nm + 1) + "-" + p2(Math.min(d, last)); // keep 31st as month-end
}
// Recurring templates create real transactions once their date arrives (Spendee "transactionTemplates").
function materializeRecurring(db, upTo = today()){
  let n = 0;
  for (const tp of db.templates){
    while (tp.next <= upTo && (!tp.endDate || tp.next <= tp.endDate)){
      if (tp.transferTo) addTransfer(db, tp.walletId, tp.transferTo, tp.amount, tp.next, tp.note).forEach(t => t.templateId = tp.id);
      else addTx(db, { walletId: tp.walletId, amount: tp.amount, category: tp.category, date: tp.next, note: tp.note, labels: tp.labels || [], templateId: tp.id });
      tp.next = nextDate(tp.next, tp.repeat); n++;
      if (n > 5000) return n; // guard against a corrupt template looping
    }
  }
  return n;
}

// ---- categorisation ----
const RULES = [
  [/lidl|aldi|billa|albert|kaufland|tesco|penny|rewe|edeka|carrefour|mercadona|auchan|spar|coop|supermarket|grocery|lidl|biedronka|żabka|zabka|profi|mega image|rohlik|rohlík|dm drogerie|globus/i,"groceries"],
  [/starbucks|costa|caff|coffee|kavárna|kavarna|espresso|tchibo/i,"coffee"],
  [/restaurant|bistro|pizza|burger|kfc|mcdonald|wolt|uber eats|deliveroo|glovo|foodora|bolt food|just ?eat|damejidlo|sushi|kebab/i,"restaurants"],
  [/uber|bolt|taxi|lyft|free now|metro|transit|railway|\brail|regiojet|flixbus|čd|ceske drahy|\bmhd\b|fuel|petrol|shell|omv|orlen|mol\b|benzin|parking/i,"transport"],
  [/ryanair|wizz|easyjet|lufthansa|airbnb|booking\.com|hotel|hostel|expedia|airline/i,"travel"],
  [/netflix|spotify|disney|hbo|youtube|apple\.com\/bill|icloud|google one|patreon|chatgpt|openai|adobe|prime video/i,"subs"],
  [/amazon|zalando|zara|h&m|ikea|alza|allegro|aliexpress|temu|shein|decathlon|mall\.cz/i,"shopping"],
  [/vodafone|t-mobile|o2|orange|electric|energie|\bgas\b|cez|pre\b|insurance|pojist|internet|utility/i,"bills"],
  [/rent|nájem|najem|mortgage|landlord|hypot/i,"home"],
  [/pharmacy|lékárna|lekarna|apotheke|doctor|dental|clinic|gym|fitness/i,"health"],
  [/cinema|kino|steam|playstation|xbox|concert|ticket|theatre|bar\b|pub\b/i,"fun"],
  [/\batm\b|cash withdrawal|bankomat|výběr|vyber/i,"cash"],
];
function catFromDesc(s, amount){
  if (amount > 0){
    if (/salary|payroll|mzda|plat\b|gehalt/i.test(s || "")) return "salary";
    if (/refund|return|vrácení|vraceni/i.test(s || "")) return "refunds";
    if (/interest|úrok|urok|cashback|reward/i.test(s || "")) return "interest";
    return "otherin";
  }
  for (const [re, id] of RULES) if (re.test(s || "")) return id;
  return "other";
}
// First meaningful word of a merchant: "LIDL 1234 PRAHA 5" -> "lidl", "Wolt Praha" -> "wolt".
const STOP = new Set(["the", "www", "pos", "card", "payment", "platba", "kartou", "to", "from", "sumup", "zettle", "sq"]);
function merchantKey(s){
  return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/[^a-z]+/)
    .find(w => w.length >= 3 && !STOP.has(w)) || "";
}
// Like Spendee's CategoryResolver: your last category at this merchant wins, then keyword rules.
function guessCategory(db, merchant, cents){
  const k = merchantKey(merchant);
  if (k){
    let best = null;
    for (const t of db.transactions)
      if (t.category !== SYS.transfer && t.category !== SYS.adjust && Math.sign(t.amount) === Math.sign(cents) &&
          merchantKey(t.note) === k && (!best || t.date >= best.date)) best = t;
    if (best) return { category: best.category, sure: true };
  }
  const c = catFromDesc(merchant, cents);
  return { category: c, sure: c !== "other" && c !== "otherin" };
}

// ---- CSV ----
function detectDelim(line){ const c = { ",": 0, ";": 0, "\t": 0 }; for (const ch of line) if (ch in c) c[ch]++; return Object.keys(c).sort((a, b) => c[b] - c[a])[0]; }
function splitLine(line, d){
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++){
    const ch = line[i];
    if (q){ if (ch === '"'){ if (line[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else { if (ch === '"') q = true; else if (ch === d){ out.push(cur); cur = ""; } else cur += ch; }
  }
  out.push(cur); return out.map(s => s.trim());
}
function parseDate(s){
  if (!s) return null; s = String(s).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return m[1] + "-" + p2(m[2]) + "-" + p2(m[3]);
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (m){ let a = +m[1], b = +m[2], y = m[3]; if (y.length === 2) y = "20" + y;
    const [day, mon] = a > 12 ? [a, b] : b > 12 ? [b, a] : [a, b]; // ambiguous -> EU day-first
    return y + "-" + p2(mon) + "-" + p2(day); }
  const t = Date.parse(s); return isNaN(t) ? null : today(new Date(t));
}
function csvLines(text){ return String(text).replace(/^﻿/, "").split(/\r\n|\n|\r/).filter(l => l.trim() !== ""); }

// Revolut personal statement: Type,Product,Started Date,Completed Date,Description,Amount,Fee,Currency,State,Balance
function parseRevolut(text){
  const lines = csvLines(text); if (lines.length < 2) return null;
  const d = detectDelim(lines[0]);
  const h = splitLine(lines[0], d).map(x => x.toLowerCase());
  const col = n => h.indexOf(n);
  const ci = { type: col("type"), product: col("product"), started: col("started date"), completed: col("completed date"),
    desc: col("description"), amount: col("amount"), fee: col("fee"), currency: col("currency"), state: col("state"), balance: col("balance") };
  if ([ci.type, ci.started, ci.desc, ci.amount, ci.currency, ci.state].some(i => i < 0)) return null;
  const rows = [];
  for (let i = 1; i < lines.length; i++){
    const r = splitLine(lines[i], d);
    const state = (r[ci.state] || "").toUpperCase();
    if (state !== "COMPLETED") continue; // skip PENDING / REVERTED / DECLINED / FAILED
    const date = parseDate(r[ci.completed] || r[ci.started]); if (!date) continue;
    const amt = toCents(r[ci.amount]), fee = ci.fee >= 0 ? toCents(r[ci.fee]) || 0 : 0;
    if (amt == null) continue;
    const cents = amt - fee; if (!cents) continue;
    const type = (r[ci.type] || "").toUpperCase(), desc = (r[ci.desc] || "").trim() || type;
    const internal = type === "EXCHANGE" || type === "TOPUP" || /^to (savings|pocket)|^from (savings|pocket)/i.test(desc);
    rows.push({ date, desc: desc.slice(0, 80), cents, currency: (r[ci.currency] || "").toUpperCase(),
      product: (ci.product >= 0 ? r[ci.product] : "") || "Current",
      category: internal ? SYS.transfer : type === "ATM" ? "cash" : type === "FEE" ? "fees" : catFromDesc(desc, cents),
      countInOverview: !internal, balance: ci.balance >= 0 ? toCents(r[ci.balance]) : null,
      key: "rev|" + (r[ci.started] || date) + "|" + r[ci.amount] + "|" + r[ci.currency] + "|" + desc });
  }
  return { kind: "revolut", rows };
}
function parseGenericCSV(text){
  const lines = csvLines(text); if (lines.length < 2) return { rows: [], error: "That file looks empty." };
  const d = detectDelim(lines[0]);
  const h = splitLine(lines[0], d).map(x => x.toLowerCase());
  const find = names => { for (let i = 0; i < h.length; i++) for (const n of names) if (h[i].includes(n)) return i; return -1; };
  const ci = { date: find(["date","datum","booking","posted","fecha","data"]),
    desc: find(["description","payee","name","details","reference","memo","narrative","merchant","counterparty","protistrana","popis","zpráva","beschreibung","verwendungszweck","concepto","omschrijving","descrizione"]),
    amount: find(["amount","částka","castka","value","betrag","montant","importe","importo","bedrag","kwota","suma"]),
    debit: find(["debit","paid out","money out","withdrawal"]), credit: find(["credit","paid in","money in","deposit"]),
    currency: find(["currency","měna","mena","währung","devise","moneda"]) };
  if (ci.date < 0 || (ci.amount < 0 && ci.debit < 0 && ci.credit < 0)) return { rows: [], error: "Couldn't find date and amount columns in that CSV." };
  const rows = [];
  for (let i = 1; i < lines.length; i++){
    const r = splitLine(lines[i], d); if (r.length < 2) continue;
    const date = parseDate(r[ci.date]); if (!date) continue;
    let cents;
    if (ci.amount >= 0) cents = toCents(r[ci.amount]);
    else { const deb = ci.debit >= 0 ? toCents(r[ci.debit]) : null, cre = ci.credit >= 0 ? toCents(r[ci.credit]) : null;
      cents = deb ? -Math.abs(deb) : cre ? Math.abs(cre) : null; }
    if (!cents) continue;
    const desc = ((ci.desc >= 0 ? r[ci.desc] : "") || "").trim() || "Transaction";
    rows.push({ date, desc: desc.slice(0, 80), cents, currency: ci.currency >= 0 ? (r[ci.currency] || "").toUpperCase() : "",
      category: catFromDesc(desc, cents), countInOverview: true, key: "csv|" + date + "|" + cents + "|" + desc });
  }
  return { kind: "generic", rows };
}
function parseAnyCSV(text){ return parseRevolut(text) || parseGenericCSV(text); }

// Revolut rows go to one wallet per product+currency ("Revolut Current EUR"); generic rows to the chosen wallet.
function importRows(db, parsed, targetWalletId){
  const seen = new Set(db.transactions.flatMap(t => [t.importKey, t.statementKey]).filter(Boolean));
  const created = new Map(); // new Revolut wallet id -> latest row (by date) carrying Revolut's running balance
  let added = 0, dup = 0;
  for (const r of parsed.rows){
    if (seen.has(r.key)){ dup++; continue; }
    let wid = targetWalletId;
    if (parsed.kind === "revolut"){
      const name = "Revolut " + r.product + " " + r.currency;
      let w = db.wallets.find(x => x.name === name);
      if (!w){ w = { id: uid(), name, currency: r.currency || db.base, startingBalance: 0, type: "bank" }; db.wallets.push(w); created.set(w.id, null); }
      wid = w.id;
      const last = created.get(wid);
      if (created.has(wid) && r.balance != null && (!last || r.date >= last.date)) created.set(wid, r);
    }
    const category = r.category === "other" || r.category === "otherin" ? guessCategory(db, r.desc, r.cents).category : r.category;
    const fx = inWalletCurrency(db, r.cents, r.currency, wallet(db, wid));
    // Bank sync or the savings mirror may already have this row: link the statement to it instead of adding a copy.
    const twin = db.transactions.find(t => t.walletId === wid && (t.source === "bank" || t.source === "mirror") && !t.statementKey &&
      t.amount === fx.amount && dayGap(t.date, r.date) <= 1);
    if (twin){ twin.statementKey = r.key; seen.add(r.key); dup++; continue; }
    addTx(db, { walletId: wid, amount: fx.amount, original: fx.original, unconverted: fx.unconverted, category, date: r.date, note: r.desc,
      countInOverview: r.countInOverview, importKey: r.key, source: parsed.kind });
    seen.add(r.key); added++;
  }
  for (const w of db.wallets) if (!w.kind) w.kind = /deposit|savings|vault|pocket/i.test(w.name) ? "savings" : "account";
  // Open each new wallet at the balance Revolut reports, so totals match the bank even for a partial statement.
  for (const [wid, r] of created) if (r) wallet(db, wid).startingBalance = r.balance - walletBalance(db, wid, r.date);
  return { added, dup };
}

// Apple Pay capture: an iOS Shortcut opens the page with  #add-<base64url("amount|merchant|card")>
// (artifact links pass only plain #anchors) or, self-hosted, #add?amount=…&merchant=…&card=…
function parseCaptureHash(hash){
  hash = hash || "";
  let raw = "", merchant = "", card = "", cur = "";
  const b64 = /^#add-([A-Za-z0-9_-]+)$/.exec(hash);
  if (b64){
    try {
      const bin = atob(b64[1].replace(/-/g, "+").replace(/_/g, "/"));
      [raw = "", merchant = "", card = ""] = new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))).split("|");
    } catch (e) { return null; }
  } else if (/^#add(\?|$)/.test(hash)){
    const q = new URLSearchParams(hash.replace(/^#add\??/, ""));
    raw = q.get("amount") || ""; merchant = q.get("merchant") || ""; card = q.get("card") || ""; cur = q.get("currency") || "";
  } else return null;
  const cents = toCents(raw);
  if (cents == null) return null;
  merchant = merchant.trim().slice(0, 80);
  return { cents: -Math.abs(cents), currency: currencyFromText(raw + " " + cur, ""), merchant,
    card: card.trim().slice(0, 60), category: catFromDesc(merchant, -1) };
}

// Wallet for a captured card payment: the one used for this card before, a wallet named after the card (same currency
// first: a CZK payment on a Revolut card still lands in "Revolut EUR"), then one in the payment's currency.
function captureWallet(db, cap){
  const card = cap.card.toLowerCase(), cur = w => !cap.currency || w.currency === cap.currency, named = w => card && w.name.toLowerCase().includes(card);
  return db.cardMap[cap.card] || (db.wallets.find(w => named(w) && cur(w)) || db.wallets.find(named) || db.wallets.find(cur) || db.wallets[0] || {}).id;
}
// Payments queued by the iPhone app's "Log payment in Acorn" action: [{id, amount, merchant, card, date}].
// Returns ids safe to drop from the queue (stored, already stored, or unreadable); kept ones wait for a wallet.
function importQueued(db, items){
  const seen = new Set(db.transactions.map(t => t.importKey).filter(Boolean));
  const ack = [];
  let added = 0, unsure = 0;
  for (const it of items){
    const key = "ap|" + it.id, cents = toCents(it.amount);
    if (seen.has(key) || !cents){ ack.push(it.id); continue; }
    const cap = { cents: -Math.abs(cents), currency: currencyFromText(it.amount, ""), merchant: String(it.merchant || "").trim().slice(0, 80), card: String(it.card || "").trim().slice(0, 60) };
    const wid = captureWallet(db, cap);
    if (!wid) continue;
    const g = guessCategory(db, cap.merchant, cap.cents);
    if (!g.sure) unsure++;
    const fx = inWalletCurrency(db, cap.cents, cap.currency, wallet(db, wid));
    addTx(db, { walletId: wid, amount: fx.amount, original: fx.original, unconverted: fx.unconverted, category: g.category,
      date: /^\d{4}-\d{2}-\d{2}$/.test(it.date) ? it.date : today(), note: cap.merchant, source: "applepay", importKey: key });
    if (cap.card && !db.cardMap[cap.card]) db.cardMap[cap.card] = wid;
    seen.add(key); ack.push(it.id); added++;
  }
  return { added, unsure, ack };
}

// ---- bank sync: Enable Banking accounts/transactions handed over by the iPhone app ----
// Revolut-style moves that aren't spending: currency exchanges, vault/pocket moves, top-ups.
const INTERNAL = /^exchanged (to|from)|^to (savings|pocket|vault)|^from (savings|pocket|vault)|top-?up/i;
function bankTxFields(t){
  const debit = t.credit_debit_indicator === "DBIT", amt = t.transaction_amount || {}, cents = toCents(amt.amount);
  if (cents == null) return null;
  const party = debit ? t.creditor && t.creditor.name : t.debtor && t.debtor.name;
  const text = [].concat(t.remittance_information || []).join(" ").trim();
  return { cents: (debit ? -1 : 1) * Math.abs(cents), currency: String(amt.currency || "").toUpperCase(),
    date: String(t.booking_date || t.value_date || t.transaction_date || "").slice(0, 10),
    note: String(party || text || "Bank transaction").trim().slice(0, 80), text,
    ref: t.entry_reference || t.transaction_id || "", booked: !t.status || t.status === "BOOK" };
}
// Each bank account gets one wallet: an existing one for that bank and currency (e.g. "Revolut Current EUR"), else a new one.
function bankWallet(db, acc){
  db.bankLinks = db.bankLinks || {};
  if (wallet(db, db.bankLinks[acc.uid])) return db.bankLinks[acc.uid];
  const taken = new Set(Object.values(db.bankLinks)), bank = String(acc.bank || "Bank");
  const fits = db.wallets.filter(w => w.currency === acc.currency && !taken.has(w.id) && w.name.toLowerCase().includes(bank.toLowerCase()));
  let w = fits.find(x => /current/i.test(x.name)) || fits[0];
  if (!w){ w = { id: uid(), name: bank + " " + acc.currency, currency: acc.currency || db.base, startingBalance: 0, type: "bank", kind: "account" }; db.wallets.push(w); }
  db.bankLinks[acc.uid] = w.id;
  return w.id;
}
const dayGap = (a, b) => Math.abs(Date.parse(a) - Date.parse(b)) / 864e5;
function importBank(db, data, now = today()){
  let added = 0, matched = 0;
  const seen = new Set(db.transactions.flatMap(t => [t.importKey, t.bankRef]).filter(Boolean));
  for (const acc of (data && data.accounts) || []){
    const wid = bankWallet(db, acc), w = wallet(db, wid);
    for (const raw of acc.transactions || []){
      const f = bankTxFields(raw);
      if (!f || !f.booked || !f.cents || !/^\d{4}-\d{2}-\d{2}$/.test(f.date)) continue; // pending payments wait until booked
      const key = "eb|" + acc.uid + "|" + (f.ref || f.date + "|" + f.cents + "|" + f.note);
      if (seen.has(key)) continue;
      seen.add(key);
      const fx = inWalletCurrency(db, f.cents, f.currency, w);
      // Already here from an Apple Pay tap or a statement import? Link it (taking the bank's exact amount) instead of adding a copy.
      const twin = db.transactions.find(t => t.walletId === wid && !t.bankRef && Math.sign(t.amount) === Math.sign(fx.amount) &&
        (t.source === "applepay" ? dayGap(t.date, f.date) <= 3 && Math.abs(t.amount - fx.amount) <= Math.max(5, Math.abs(fx.amount) * 0.03)
          : t.amount === fx.amount && dayGap(t.date, f.date) <= 1));
      if (twin){ twin.bankRef = key; if (twin.source === "applepay"){ twin.amount = fx.amount; twin.unconverted = false; } matched++; continue; }
      const internal = INTERNAL.test(f.note) || INTERNAL.test(f.text);
      addTx(db, { walletId: wid, amount: fx.amount, original: fx.original, unconverted: fx.unconverted, date: f.date, note: f.note,
        category: internal ? SYS.transfer : guessCategory(db, f.note + " " + f.text, fx.amount).category,
        countInOverview: !internal, importKey: key, source: "bank" });
      added++;
    }
    const bal = acc.balance == null ? null : toCents(acc.balance);
    if (bal != null) w.startingBalance = (w.startingBalance || 0) + bal - walletBalance(db, wid, now); // wallet shows the bank's balance to the cent
  }
  return { added, matched };
}

// ---- savings mirror: Revolut savings aren't in open banking, but every move shows on the current account ----
const SAVINGS_WORDS = /savings|deposit|vault|pocket/i;
// "Personal -> Savings Account" (money in) / "Savings Account -> Personal" (money out) / "To 'Holiday vault'".
function savingsPot(note){
  const s = String(note || "");
  if (s.includes("->")) return s.split("->").map(p => p.trim()).find(p => SAVINGS_WORDS.test(p)) || null;
  const q = /(?:^|\s)(?:to|from)\s+'([^']+)'/i.exec(s);
  return q && SAVINGS_WORDS.test(q[1]) && !/interest/i.test(s) ? q[1].trim() : null;
}
// The savings wallet a pot feeds: remembered once chosen, else the savings wallet (same currency) whose own rows mention the pot,
// e.g. "Net Interest Paid to 'Savings Account'" in Revolut Deposit RON; else any savings wallet in that currency; else a new one.
function potWallet(db, pot, cur){
  db.potLinks = db.potLinks || {};
  const key = pot.toLowerCase() + "|" + cur;
  if (wallet(db, db.potLinks[key])) return db.potLinks[key];
  const pots = db.wallets.filter(w => isSavings(w) && w.currency === cur);
  const mentions = w => db.transactions.filter(t => t.walletId === w.id && String(t.note || "").toLowerCase().includes(pot.toLowerCase())).length;
  let w = pots.map(x => [x, mentions(x)]).sort((a, b) => b[1] - a[1]).find(([, n]) => n > 0)?.[0]
    || pots.find(x => x.name.toLowerCase().includes(pot.toLowerCase())) || pots.find(x => /deposit|savings/i.test(x.name));
  if (!w){ w = { id: uid(), name: pot + " " + cur, currency: cur, startingBalance: 0, type: "bank", kind: "savings" }; db.wallets.push(w); }
  db.potLinks[key] = w.id;
  return w.id;
}
// Pairs each savings move on a current account with its other side in the savings wallet, as a transfer.
// Uses a row the savings statement already imported when there is one; otherwise adds the mirror. Safe to run repeatedly.
function mirrorSavings(db){
  let n = 0;
  for (const t of db.transactions.slice()){
    const w = wallet(db, t.walletId);
    if (!w || isSavings(w) || t.linkedId || t.mirrorOf) continue;
    const pot = savingsPot(t.note); if (!pot) continue;
    const sw = wallet(db, potWallet(db, pot, w.currency)), amount = convert(db, -t.amount, w.currency, sw.currency);
    t.category = SYS.transfer; t.countInOverview = false;
    const twin = db.transactions.find(x => x.walletId === sw.id && !x.linkedId && x.amount === amount && dayGap(x.date, t.date) <= 1);
    const other = twin || addTx(db, { walletId: sw.id, amount, category: SYS.transfer, date: t.date, note: t.note, countInOverview: false, source: "mirror" });
    other.category = SYS.transfer; other.countInOverview = false; other.mirrorOf = t.id;
    t.linkedId = other.id; other.linkedId = t.id;
    n++;
  }
  return n;
}

// ---- goals: each follows a savings pot ----
function monthsBetween(fromYm, toYm){ const [a, b] = fromYm.split("-").map(Number), [c, d] = toYm.split("-").map(Number); return (c - a) * 12 + (d - b); }
function goalStatus(db, g, now = today()){
  const pot = wallet(db, g.potId), cur = g.currency || (pot && pot.currency) || db.base;
  const saved = pot ? Math.max(0, convert(db, walletBalance(db, pot.id, now), pot.currency, cur)) : 0;
  const left = Math.max(0, g.target - saved), frac = g.target ? Math.min(1, saved / g.target) : 0;
  // Recent pace: what went into the pot over the last 3 full months, per month.
  const from = shiftYm(ymOf(now), -3) + "-01", to = shiftYm(ymOf(now), -1) + "-31";
  const pace = pot ? Math.round(db.transactions.filter(t => t.walletId === pot.id && t.date >= from && t.date <= to)
    .reduce((s, t) => s + convert(db, t.amount, pot.currency, cur), 0) / 3) : 0;
  const months = g.date ? Math.max(1, monthsBetween(ymOf(now), g.date) + 1) : null; // this month counts
  const monthly = months ? Math.ceil(left / months) : null;
  const eta = !left ? 0 : pace > 0 ? Math.ceil(left / pace) : null;
  return { saved, left, frac, cur, pace, months, monthly, eta, done: !left, onTrack: !left || (monthly != null ? pace >= monthly : null) };
}
// Milestones newly reached (25/50/75/100%), recorded on the goal so each one notifies once.
function goalMilestones(db, now = today()){
  const out = [];
  for (const g of db.goals){
    const st = goalStatus(db, g, now), reached = [25, 50, 75, 100].filter(p => st.frac * 100 >= p);
    g.notified = g.notified || [];
    const fresh = reached.filter(p => !g.notified.includes(p));
    if (!fresh.length) continue;
    g.notified.push(...fresh);
    const top = Math.max(...fresh);
    out.push({ id: "goal-" + g.id + "-" + top, title: top === 100 ? g.icon + " " + g.name + ": goal reached!" : g.icon + " " + g.name + " is " + top + "% there",
      body: money(st.saved, st.cur) + " of " + money(g.target, st.cur) + (top < 100 && st.monthly ? ". " + money(st.monthly, st.cur) + "/month to finish on time." : ".") });
  }
  return out;
}

// ---- budget suggestions: typical month = middle value of the last 3 full months, rounded up ----
function roundUpNice(c){ const u = c < 10000 ? 500 : c < 100000 ? 1000 : 5000; return Math.ceil(c / u) * u; }
function suggestBudgets(db, now = today()){
  const yms = [3, 2, 1].map(i => shiftYm(ymOf(now), -i));
  const spend = yms.map(ym => Object.fromEntries(categorySpend(db, ym).map(x => [x.category, x.cents])));
  const dismissed = new Set(db.dismissedTips || []), out = [];
  for (const c of db.categories.filter(c => c.type === "expense" && !c.hidden)){
    const months = spend.map(m => m[c.id] || 0);
    if (months.filter(Boolean).length < 2) continue; // not regular spending
    const typical = [...months].sort((a, b) => a - b)[1], amount = roundUpNice(typical);
    const own = db.budgets.find(b => b.categories.length === 1 && b.categories[0] === c.id);
    if (!own){ if (db.budgets.some(b => !b.categories.length || b.categories.includes(c.id))) continue; // already covered
      out.push({ key: "new|" + c.id, kind: "new", category: c.id, amount, typical, months }); continue; }
    const over = months.every(v => v > own.amount), under = months.every(v => v < own.amount * 0.8);
    if (over && amount > own.amount) out.push({ key: "raise|" + own.id + "|" + amount, kind: "raise", category: c.id, budgetId: own.id, amount, typical, months });
    else if (under && amount < own.amount) out.push({ key: "lower|" + own.id + "|" + amount, kind: "lower", category: c.id, budgetId: own.id, amount, typical, months });
  }
  return out.filter(s => !dismissed.has(s.key)).sort((a, b) => b.typical - a.typical);
}
function applySuggestion(db, s){
  const c = category(db, s.category);
  if (s.kind === "new") db.budgets.push({ id: uid(), name: c.name, amount: s.amount, currency: db.base, categories: [c.id], walletIds: [] });
  else { const b = db.budgets.find(x => x.id === s.budgetId); if (b) b.amount = s.amount; }
}

// ---- fun facts: money in things you can picture ----
// Prices are rough EUR figures; a fact using them only appears when an exchange rate to EUR is known.
const THINGS = [["flat whites", 350], ["cinema tickets", 1000], ["months of Spotify", 1100], ["Big Macs", 550], ["pizzas", 1200],
  ["years of Netflix", 15600], ["pairs of AirPods Pro", 27900], ["new iPhones", 99900], ["weekend city breaks", 45000], ["PlayStation 5s", 49900]];
function funFacts(db, now = today()){
  const out = [], f = monthFlow(db, ymOf(now)), spent = f.expense, saved = savingsBalance(db, now), spendable = spendableBalance(db, now);
  const nf = (n, d = 0) => { try { return new Intl.NumberFormat(undefined, { maximumFractionDigits: d }).format(n); } catch (e) { return String(Math.round(n)); } };
  const eur = c => db.base === "EUR" ? c : hasRate(db, "EUR") ? convert(db, c, db.base, "EUR") : null;
  const pick = (cents, minCount) => THINGS.map(([name, price]) => [name, cents / price]).filter(([, n]) => n >= minCount && n < 5000);
  if (spent > 0 && eur(spent) != null) for (const [name, n] of pick(eur(spent), 2)) out.push("This month's spending is about " + nf(n) + " " + name + ".");
  if (saved > 0 && eur(saved) != null){
    for (const [name, n] of pick(eur(saved), 1)) out.push("Your savings could buy " + nf(n, n < 10 ? 1 : 0) + " " + name + ".");
    const m = eur(saved) / 100 * 2.33 / 1000; // €1 coins are 2.33 mm thick
    if (m >= 1) out.push("Stacked in €1 coins, your savings would stand " + nf(m, 1) + " m tall" + (m > 9 ? ", about a " + Math.round(m / 3) + "-storey building." : "."));
  }
  if (spendable > 0 && eur(spendable) != null){ const metres = eur(spendable) / 500 * 0.12; // €5 notes are 12 cm long
    if (metres >= 1) out.push("Laid end to end in €5 notes, your spendable money would stretch " + nf(metres, 1) + " m."); }
  // Your own habits: how many of your usual orders this month's spending is.
  const since = shiftYm(ymOf(now), -3) + "-01", usual = {};
  for (const t of db.transactions) if (t.date >= since && t.date <= now && counts(t) && t.amount < 0 && t.note){
    const k = merchantKey(t.note); if (!k) continue; (usual[k] = usual[k] || { note: t.note, sum: 0, n: 0 }); usual[k].sum -= txBase(db, t); usual[k].n++; }
  for (const u of Object.values(usual).filter(u => u.n >= 3).sort((a, b) => b.n - a.n).slice(0, 3)){
    const avg = u.sum / u.n; if (spent >= avg * 2) out.push("This month's spending equals " + nf(spent / avg) + "× your usual " + u.note + " (" + money(Math.round(avg), db.base) + ").");
  }
  for (const g of db.goals){ const st = goalStatus(db, g, now);
    if (!st.done && st.left > 0 && eur(convert(db, st.left, st.cur, db.base)) != null){
      const coffees = eur(convert(db, st.left, st.cur, db.base)) / 350; if (coffees >= 2) out.push(g.icon + " " + g.name + " is " + nf(coffees) + " flat whites away."); } }
  return out;
}

// Moves everything from one category to another (transactions, recurring, budgets), then removes it.
function mergeCategory(db, from, to){
  for (const t of db.transactions) if (t.category === from) t.category = to;
  for (const t of db.templates) if (t.category === from) t.category = to;
  for (const b of db.budgets) b.categories = [...new Set(b.categories.map(id => id === from ? to : id))];
  db.categories = db.categories.filter(c => c.id !== from);
}

// ---- trends ----
function daysIn(ym){ const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); }
function monthSeries(db, endYm, n){
  const out = [];
  for (let i = n - 1; i >= 0; i--){ const ym = shiftYm(endYm, -i); out.push({ ym, ...monthFlow(db, ym) }); }
  return out;
}
// Cumulative spending per day of the month, against the month's total budget (or last month's spending when there are no budgets).
// With budgets, only spending they cover counts, so rent outside any budget doesn't make you look "ahead".
function dailyPace(db, ym, now = today()){
  const days = daysIn(ym), upto = ymOf(now) === ym ? +now.slice(8, 10) : ymOf(now) > ym ? days : 0;
  const perDay = new Array(days).fill(0);
  const covered = t => !db.budgets.length || db.budgets.some(b => (!b.categories.length || b.categories.includes(t.category)) && (!b.walletIds || !b.walletIds.length || b.walletIds.includes(t.walletId)));
  for (const t of monthTxs(db, ym)){ const v = txBase(db, t); if (v < 0 && covered(t)) perDay[+t.date.slice(8, 10) - 1] -= v; }
  const cumulative = []; let run = 0;
  for (let d = 0; d < upto; d++){ run += perDay[d]; cumulative.push(run); }
  const budgetTotal = db.budgets.reduce((s, b) => s + convert(db, b.amount, b.currency || db.base, db.base), 0);
  return { days, cumulative, target: budgetTotal || monthFlow(db, shiftYm(ym, -1)).expense, targetIsBudget: budgetTotal > 0 };
}
function categoryDelta(db, ym){
  const prev = Object.fromEntries(categorySpend(db, shiftYm(ym, -1)).map(x => [x.category, x.cents]));
  const cur = categorySpend(db, ym);
  const ids = new Set([...cur.map(x => x.category), ...Object.keys(prev)]);
  return [...ids].map(id => { const c = (cur.find(x => x.category === id) || { cents: 0 }).cents, p = prev[id] || 0;
    return { category: id, cents: c, prev: p, delta: c - p }; }).sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
}
// Merchants you use most in the last 90 days, newest category for each: one-tap chips when adding.
function recentMerchants(db, sign, n = 8, now = today()){
  const since = shiftYm(ymOf(now), -3) + "-01", seen = {};
  for (const t of db.transactions){
    if (!t.note || t.date < since || t.date > now || Math.sign(t.amount) !== sign || t.category === SYS.transfer || t.category === SYS.adjust) continue;
    const k = merchantKey(t.note); if (!k) continue;
    const e = seen[k] || (seen[k] = { note: t.note, category: t.category, count: 0, date: "" });
    e.count++; if (t.date >= e.date){ e.date = t.date; e.note = t.note; e.category = t.category; }
  }
  return Object.values(seen).sort((a, b) => b.count - a.count || b.date.localeCompare(a.date)).slice(0, n);
}

// ---- digest: what the iPhone app shows outside the page (widget, notifications); runs in the page and in iOS's JavaScriptCore ----
function money(cents, cur){
  try { return new Intl.NumberFormat(undefined, { style: "currency", currency: cur }).format(cents / 100); }
  catch (e) { return (cents / 100).toFixed(2) + " " + cur; }
}
function budgetStatus(db, ym){
  return db.budgets.map(b => { const spent = budgetSpent(db, b, ym), cats = b.categories.map(id => category(db, id));
    return { id: b.id, name: b.name, spent, amount: b.amount, currency: b.currency || db.base, frac: b.amount ? spent / b.amount : 0,
      color: (cats[0] && cats[0].color) || "yellow", icon: (cats[0] && cats[0].icon) || "🎯" }; });
}
function digest(db, now = today()){
  const ym = ymOf(now), f = monthFlow(db, ym), bs = budgetStatus(db, ym);
  const total = bs.reduce((s, b) => s + convert(db, b.amount, b.currency, db.base), 0);
  const recent = db.transactions.filter(t => t.date <= now && counts(t)).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);
  return {
    v: 1, ym, base: db.base, updated: now,
    monthLabel: new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1, 1).toLocaleDateString(undefined, { month: "long" }),
    spent: f.expense, spentText: money(f.expense, db.base), budgetTotalText: total ? money(total, db.base) : "",
    budgetFrac: total ? f.expense / total : 0, leftText: total ? money(total - f.expense, db.base) : "",
    budgets: bs.sort((a, b) => b.frac - a.frac).slice(0, 6).map(b => ({ name: b.name, icon: b.icon, color: b.color, frac: Math.round(b.frac * 1000) / 1000,
      spentText: money(b.spent, b.currency), amountText: money(b.amount, b.currency) })),
    recent: recent.map(t => { const c = category(db, t.category), w = wallet(db, t.walletId);
      return { title: t.note || c.name, icon: c.icon, color: c.color || "gray", amountText: money(t.amount, w ? w.currency : db.base) }; }),
    spendableText: money(spendableBalance(db, now), db.base), savingsText: money(savingsBalance(db, now), db.base),
    goals: (db.goals || []).map(g => { const st = goalStatus(db, g, now);
      return { name: g.name, icon: g.icon || "🌰", frac: Math.round(st.frac * 1000) / 1000, savedText: money(st.saved, st.cur), targetText: money(g.target, st.cur) }; }),
  };
}
function weekStart(now){ const [y, m, d] = now.split("-").map(Number), dt = new Date(y, m - 1, d); dt.setDate(d - ((dt.getDay() + 6) % 7)); return today(dt); }
function weeklySummary(db, now = today()){
  const from = weekStart(now), txs = db.transactions.filter(t => t.date >= from && t.date <= now && counts(t) && txBase(db, t) < 0);
  if (!txs.length) return null;
  const by = {}; let spent = 0;
  for (const t of txs){ const v = -txBase(db, t); spent += v; by[t.category] = (by[t.category] || 0) + v; }
  const top = Object.entries(by).sort((a, b) => b[1] - a[1])[0], tc = category(db, top[0]);
  const risky = budgetStatus(db, ymOf(now)).filter(b => b.frac >= 0.8).map(b => b.name);
  return { title: "Your week: " + money(spent, db.base) + " spent",
    body: "Most on " + tc.icon + " " + tc.name + " (" + money(top[1], db.base) + ")." + (risky.length ? " Close to the limit: " + risky.join(", ") + "." : " All budgets on track.") };
}
// What to tell the user right after an Apple Pay capture, computed on a copy: the page imports the real queue later.
// `queued` = items still waiting (including `item`), so several payments made while Acorn was closed add up correctly.
function captureNotice(db, queued, item, now = today()){
  const copy = JSON.parse(JSON.stringify(db)), ym = ymOf(now);
  importQueued(copy, queued.filter(q => q.id !== item.id));
  const before = Object.fromEntries(budgetStatus(copy, ym).map(b => [b.id, b.frac]));
  const r = importQueued(copy, [item]);
  if (!r.added) return null;
  const t = copy.transactions.find(x => x.importKey === "ap|" + item.id), c = category(copy, t.category), w = wallet(copy, t.walletId);
  const amount = money(-t.amount, w.currency) + (t.original ? " (" + money(-t.original.amount, t.original.currency) + ")" : "");
  const notice = r.unsure
    ? { title: amount + " at " + (t.note || "a new place"), body: "New merchant, so it's under Other. Tap to pick a category; Acorn remembers it next time." }
    : { title: amount + " at " + (t.note || c.name), body: c.icon + " " + c.name + " · " + w.name };
  const alerts = [];
  for (const b of budgetStatus(copy, ym)) for (const th of [1, 0.8])
    if ((before[b.id] || 0) < th && b.frac >= th){
      alerts.push({ key: b.id + "|" + ym + "|" + th, title: th === 1 ? b.name + " budget is used up" : b.name + " budget is at " + Math.floor(b.frac * 100) + "%",
        body: money(b.spent, b.currency) + " of " + money(b.amount, b.currency) + " spent in " + new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1, 1).toLocaleDateString(undefined, { month: "long" }) + "." });
      break;
    }
  return { ...notice, alerts, digest: digest(copy, now), weekly: weeklySummary(copy, now) };
}

function validateBackup(o){
  return o && typeof o === "object" && Array.isArray(o.wallets) && Array.isArray(o.transactions) && Array.isArray(o.categories)
    && o.transactions.every(t => t && typeof t.id === "string" && Number.isInteger(t.amount) && /^\d{4}-\d{2}-\d{2}$/.test(t.date));
}

<script>
// ---- UI ----
const KEY = "tally.v1";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
let db = upgradeDb(load()), curYm = ymOf(today()), screen = "overview";

function load(){
  try { const raw = localStorage.getItem(KEY); if (raw){ const o = JSON.parse(raw); if (validateBackup(o)) return o; } } catch (e) {}
  const d = emptyDb(); d.wallets.push({ id: uid(), name: "Cash", currency: "EUR", startingBalance: 0, type: "cash", kind: "cash" }); return d;
}
// Inside the iPhone app (spendee/ios) the native side keeps the data in a file and shares backups.
const nativeApp = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.tally;
function save(){
  if (cloudState === "loading") editedEarly = true;
  let ok = true;
  mirrorSavings(db); // keep savings pots in step with every change (idempotent)
  const reached = goalMilestones(db); // marks them on the goals, so they're saved below
  const json = JSON.stringify(db);
  try { localStorage.setItem(KEY, json); } catch (e) { ok = false; }
  for (const m of reached){ if (nativeApp) try { nativeApp.postMessage({ type: "notify", id: m.id, title: m.title, body: m.body }); } catch (e) {} }
  if (reached.length) setTimeout(() => toast(reached[reached.length - 1].title), 400);
  if (nativeApp){ try { nativeApp.postMessage({ type: "save", data: json }); ok = true; } catch (e) {} }
  if (cloud) schedulePush();
  else if (!ok) toast("Couldn't save in this browser. Back up from More now.");
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
// The iPhone app shows these outside the page: widget numbers and the Sunday summary notification.
let lastDigest = "";
function publishDigest(){
  if (!nativeApp) return;
  try { const d = JSON.stringify({ digest: digest(db), weekly: weeklySummary(db) });
    if (d !== lastDigest){ lastDigest = d; nativeApp.postMessage({ type: "digest", data: d }); } } catch (e) {}
}

// ---- sync: opened as a Claude artifact, data also lives in the viewer's private store (data/users/<id>/) ----
// Settings in one document, transactions in one document per month, written only when they change.
// shortcut: whole-document writes, last writer wins between devices; fine for one person, not for live co-editing.
let cloud = null, cloudState = "off", pushed = {}, pushTimer = null, pushing = false, dirty = false, editedEarly = false;
function shards(d){
  const { transactions, ...meta } = d, out = { meta };
  for (const t of transactions){ const k = "m-" + ymOf(t.date); (out[k] = out[k] || { items: [] }).items.push(t); }
  return out;
}
function assemble(docs){
  const d = JSON.parse(JSON.stringify(docs.meta || {}));
  d.transactions = Object.keys(docs).filter(k => k.startsWith("m-")).flatMap(k => JSON.parse(JSON.stringify(docs[k].items || [])));
  return d;
}
function syncNote(){
  const el = $("#sync-note"); if (!el) return;
  el.textContent = ({
    on: "Synced to your Claude account. Only you can see this data, on any device where you open this page.",
    loading: "Connecting to your Claude account…",
    offline: "Couldn't reach your Claude account, so you're seeing the copy saved in this browser. Changes sync next time.",
    error: "Last sync failed. Your changes are kept in this browser and sync on your next change.",
    off: nativeApp ? "Everything is stored on this iPhone, inside the Acorn app. No account, no server. Back up regularly."
      : "Everything is stored only in this browser. No account, no server. Back up regularly.",
  })[cloudState];
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))]);
async function retryOnce(fn){
  try { return await fn(); }
  catch (e) { if (e && e.code === "unavailable"){ await new Promise(r => setTimeout(r, 400 + Math.random() * 800)); return fn(); } throw e; }
}
async function startCloud(){
  const c = window.claude;
  if (!c || !c.use){ syncNote(); return; }
  cloudState = "loading"; syncNote();
  const [store, user] = await Promise.all([c.use("db"), c.use("user")]);
  const id = user ? await user.id() : null;
  if (!store || !id){ cloudState = "off"; syncNote(); return; }
  const col = store.collection("data/users/" + id);
  let snap;
  try { snap = await withTimeout(col.get(), 10000); }
  catch (e) { cloudState = "offline"; syncNote(); return; }
  cloud = col;
  if (!snap.empty){
    const docs = {}; snap.docs.forEach(s => { docs[s.id] = s.data(); pushed[s.id] = JSON.stringify(s.data()); });
    const remote = assemble(docs);
    if (validateBackup(remote)){
      if (editedEarly){ // keep anything added on this device while the account was loading
        const ids = new Set(remote.transactions.map(t => t.id));
        db.transactions.forEach(t => { if (!ids.has(t.id)) remote.transactions.push(t); });
      }
      db = upgradeDb(remote);
    }
  }
  cloudState = "on"; materializeRecurring(db); save(); syncNote(); render();
}
function schedulePush(){ clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, 500); }
async function pushNow(){
  if (!cloud) return;
  if (pushing){ dirty = true; return; }
  pushing = true;
  try {
    const sh = shards(db);
    for (const [k, body] of Object.entries(sh)){
      const json = JSON.stringify(body);
      if (pushed[k] === json) continue;
      if (json.length > 250000) throw { code: "too_big", k };
      await retryOnce(() => cloud.doc(k).set(JSON.parse(json)));
      pushed[k] = json;
    }
    for (const k of Object.keys(pushed)) if (!sh[k]){ await retryOnce(() => cloud.doc(k).delete()); delete pushed[k]; }
    cloudState = "on";
  } catch (e) {
    cloudState = "error";
    toast(e && e.code === "quota_exceeded" ? "Your Acorn storage is full. Delete old wallets or transactions to keep syncing."
      : e && e.code === "too_big" ? "One month has too many transactions to sync. They're kept in this browser."
      : "Couldn't sync. Your changes are kept in this browser and sync on your next change.");
  }
  pushing = false; syncNote();
  if (dirty){ dirty = false; schedulePush(); }
}

function ask(question, okLabel, onOk){
  openSheet('<h2>' + esc(question) + '</h2><div class="btns"><button class="btn ghost" id="a-no">Cancel</button><button class="btn danger" id="a-yes">' + esc(okLabel) + '</button></div>');

  $("#a-yes").onclick = () => { closeSheet(); onOk(); };
}

function fmt(cents, cur = db.base, sign = false){
  let s;
  try { s = new Intl.NumberFormat(undefined, { style: "currency", currency: cur || db.base }).format(Math.abs(cents) / 100); }
  catch (e) { s = (Math.abs(cents) / 100).toFixed(2) + " " + cur; }
  return (cents < 0 ? "−" : sign && cents > 0 ? "+" : "") + s;
}
function monthName(ym){ const [y, m] = ym.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: "short", year: "numeric" }); }
function dayName(d){ const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" }); }
function toast(msg, onTap, action){ // action {label, fn} adds a button, e.g. Undo
  let t = $("#toast"); if (!t){ t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = "";
  const span = document.createElement("span"); span.textContent = msg; t.appendChild(span);
  if (action){ const b = document.createElement("button"); b.className = "act"; b.textContent = action.label;
    b.onclick = e => { e.stopPropagation(); t.hidden = true; action.fn(); }; t.appendChild(b); }
  t.hidden = false; t.style.cursor = onTap ? "pointer" : "";
  t.onclick = onTap ? () => { t.hidden = true; onTap(); } : null;
  clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, onTap || action ? 6000 : 2800); }
function haptic(style){ if (nativeApp) try { nativeApp.postMessage({ type: "haptic", style }); } catch (e) {} }
function openSheet(html){
  $("#sheet").innerHTML = '<button class="x" id="sheet-x" aria-label="Close">✕</button>' + html;
  $("#sheet-x").onclick = closeSheet;
  $("#sheet").style.transform = ""; $("#scrim").classList.add("open");
}
function closeSheet(){ $("#scrim").classList.remove("open"); if (nativeApp) try { nativeApp.postMessage({ type: "sheetClosed" }); } catch (e) {} } // a waiting update can load now
// Swipe a sheet down to close it, like iOS sheets; only from the top, so scrolling a long sheet still works.
(function sheetSwipe(){
  const sh = $("#sheet"); let y0 = null, dy = 0;
  sh.addEventListener("touchstart", e => { y0 = sh.scrollTop <= 0 && !e.target.closest("input,select,textarea,.keypad") ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  sh.addEventListener("touchmove", e => { if (y0 === null) return; dy = e.touches[0].clientY - y0;
    if (dy > 0){ e.preventDefault(); sh.classList.add("dragging"); sh.style.transform = "translateY(" + dy + "px)"; } }, { passive: false });
  sh.addEventListener("touchend", () => { if (y0 === null) return; sh.classList.remove("dragging"); y0 = null;
    if (dy > 110){ sh.style.transform = "translateY(100%)"; setTimeout(closeSheet, 180); } else sh.style.transform = ""; });
})();
$("#scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function deleteWithUndo(id){
  const t = db.transactions.find(x => x.id === id); if (!t) return;
  const removed = db.transactions.filter(x => x.id === id || x.id === t.linkedId);
  deleteTx(db, id); save(); render(); haptic("warning");
  toast("Deleted " + (t.note || category(db, t.category).name), null, { label: "Undo", fn: () => { db.transactions.push(...removed); save(); render(); haptic("light"); } });
}

function txRow(t, swipe){
  const c = category(db, t.category), w = wallet(db, t.walletId), k = txKind(t);
  let title = t.note || c.name;
  if (k === "transfer"){ const o = db.transactions.find(x => x.id === t.linkedId), ow = o && wallet(db, o.walletId);
    title = ow ? (t.amount < 0 ? "To " : "From ") + ow.name + (t.note ? " · " + t.note : "") : t.note || "Transfer"; } // unpaired (e.g. a Revolut exchange): just its note
  const orig = t.original ? fmt(t.original.amount, t.original.currency) + (t.unconverted ? " ⚠ no exchange rate, edit the amount" : "") : "";
  const meta = [w ? w.name : "?", t.note ? c.name : "", orig, ...(t.labels || []).map(l => "#" + l), t.templateId ? "🔁" : ""].filter(Boolean).join(" · ");
  const row = '<button class="li" data-tx="' + t.id + '" style="--c:var(--' + (c.color || "gray") + ')"><span class="ic">' + c.icon + '</span><span class="mid"><span class="ttl">' + esc(title) +
    '</span><span class="meta">' + esc(meta) + '</span></span><span class="amt ' + k + '">' + fmt(t.amount, w ? w.currency : db.base, true) + '</span></button>';
  return swipe ? '<div class="swipe" data-swipe="' + t.id + '"><div class="under" aria-hidden="true"><span class="l">EDIT →</span><span class="r">← DELETE</span></div>' + row + '</div>' : row;
}

// ---- charts (SVG drawn to scale from theme tokens) ----
const compact = c => { try { return new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 }).format(c / 100); } catch (e) { return String(Math.round(c / 100)); } };
function barsSvg(series){
  const W = 320, H = 118, top = 16, base = 96, bw = 30, gap = (W - bw * series.length) / series.length, max = Math.max(1, ...series.map(s => s.expense));
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Spending in the last ' + series.length + ' months">' +
    '<line x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '" style="stroke:var(--line)"/>' +
    series.map((s, i) => { const x = gap / 2 + i * (bw + gap), h = Math.max(2, (base - top) * s.expense / max), last = i === series.length - 1;
      return '<rect x="' + x.toFixed(1) + '" y="' + (base - h).toFixed(1) + '" width="' + bw + '" height="' + h.toFixed(1) + '" rx="4" style="fill:var(' + (last ? "--gold" : "--glass-hi") + ')"/>' +
        '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (base - h - 4).toFixed(1) + '" text-anchor="middle"' + (last ? ' style="fill:var(--fg)"' : "") + '>' + compact(s.expense) + '</text>' +
        '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + new Date(+s.ym.slice(0, 4), +s.ym.slice(5, 7) - 1, 1).toLocaleDateString(undefined, { month: "short" }) + '</text>'; }).join("") + '</svg>';

function paceSvg(p){
  const W = 320, H = 130, L = 4, R = 316, T = 10, B = 110, last = p.cumulative[p.cumulative.length - 1] || 0;
  const max = Math.max(1, p.target, last) * 1.08, x = d => L + (R - L) * d / p.days, y = v => B - (B - T) * v / max;
