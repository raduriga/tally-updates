    [0.5, 1].map(f => '<line x1="' + L + '" x2="' + R + '" y1="' + y(max * f / 1.08).toFixed(1) + '" y2="' + y(max * f / 1.08).toFixed(1) + '" style="stroke:var(--line)"/>').join("") +
    (p.target ? '<line x1="' + x(0) + '" y1="' + y(0) + '" x2="' + x(p.days) + '" y2="' + y(p.target).toFixed(1) + '" style="stroke:var(--dim);stroke-dasharray:4 4;stroke-width:1.5"/>' : "") +
    (line ? '<path d="' + line + " L" + x(p.cumulative.length).toFixed(1) + "," + y(0) + ' Z" style="fill:color-mix(in srgb,var(--gold) 16%,transparent)"/>' +
      '<path d="' + line + '" style="fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round"/>' +
      '<circle cx="' + x(p.cumulative.length).toFixed(1) + '" cy="' + y(last).toFixed(1) + '" r="4" style="fill:var(--gold);stroke:var(--ground);stroke-width:2"/>' : "") +
    '<text x="' + L + '" y="' + (H - 4) + '">1</text><text x="' + R + '" y="' + (H - 4) + '" text-anchor="end">' + p.days + '</text></svg>';
}

// A random fact each time the screen draws; tapping shows another.
function funFactCard(){
  const fs = funFacts(db); if (!fs.length) return "";

    '<div id="fact-text" style="margin-top:6px;font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.35">' + esc(fs[Math.floor(Math.random() * fs.length)]) + '</div></button>';
}
const ymLabel = ym => ym ? new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1, 1).toLocaleDateString(undefined, { month: "short", year: "numeric" }) : "";
function ringSvg(frac, colorVar){
  const r = 18, c = 2 * Math.PI * r, pct = Math.round(frac * 100);
  return '<svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true" style="flex:none"><circle cx="24" cy="24" r="' + r + '" style="fill:none;stroke:var(--glass-hi);stroke-width:5"/>' +
    '<circle cx="24" cy="24" r="' + r + '" transform="rotate(-90 24 24)" style="fill:none;stroke:var(' + colorVar + ');stroke-width:5;stroke-linecap:round" stroke-dasharray="' + (c * Math.min(1, frac)).toFixed(1) + ' ' + c.toFixed(1) + '"/>' +
    '<text x="24" y="28" text-anchor="middle" style="font-family:var(--mono);font-size:11px;font-weight:700;fill:var(--fg)">' + pct + '%</text></svg>';
}
function goalCard(g){
  const st = goalStatus(db, g), pot = wallet(db, g.potId);
  const plan = st.done ? "Reached. Well done!" : st.monthly != null
    ? fmt(st.monthly, st.cur) + "/month to make " + ymLabel(g.date) + (st.onTrack ? " · on track" : " · behind at your recent pace")
    : st.eta != null ? "About " + st.eta + " month" + (st.eta === 1 ? "" : "s") + " at your recent pace" : "Nothing added in the last 3 months";

    '<span style="min-width:0;flex:1"><b>' + esc((g.icon || "🎯") + " " + g.name) + '</b><span class="mini mono" style="display:block;margin-top:2px">' + fmt(st.saved, st.cur) + ' of ' + fmt(g.target, st.cur) +
    (pot ? ' · ' + esc(pot.name) : "") + '</span><span class="mini" style="display:block;margin-top:2px">' + esc(plan) + '</span></span></button>';
}

function renderOverview(){
  $("#ov-month").textContent = monthName(curYm);
  const f = monthFlow(db, curYm), deltas = categoryDelta(db, curYm).filter(d => d.cents > 0).sort((a, b) => b.cents - a.cents);
  const max = deltas[0] ? deltas[0].cents : 1, pace = dailyPace(db, curYm), series = monthSeries(db, curYm, 6);

    '<div class="grid2"><div class="card stat"><div class="k">Spent · ' + esc(monthName(curYm)) + '</div><div class="v">' + fmt(f.expense) + '</div></div>' +
    '<div class="card stat"><div class="k">In · net</div><div class="v" style="color:var(--green)">' + fmt(f.income) + '</div><div class="mini mono">' + fmt(f.net, db.base, true) + '</div></div></div>' +
    funFactCard() +

    (now && (pace.target || spentNow) ? '<div class="card"><div class="eyebrow">Pace</div>' + paceSvg(pace) +
      '<div class="legend"><span><i style="background:var(--gold)"></i>' + (pace.targetIsBudget ? "Budgeted spending" : "You") + '</span>' + (pace.target ? '<span><i style="background:var(--dim)"></i>' + (pace.targetIsBudget ? "Budget pace" : "Last month") + '</span>' : "") + '</div>' +
      (paceNote ? '<div class="mini" style="margin-top:6px">' + esc(paceNote) + '</div>' : "") + '</div>' : "") +
    '<div class="sectitle"><h2>Categories</h2><span class="mini mono" style="margin-left:auto">vs ' + esc(monthName(shiftYm(curYm, -1))) + '</span></div><div class="card">' +
    (deltas.length ? deltas.map(x => { const c = category(db, x.category), d = x.delta;
      const pill = !x.prev ? '<span class="pill">new</span>' : !d ? '<span class="pill">same</span>' : '<span class="pill ' + (d > 0 ? "up" : "down") + '">' + (d > 0 ? "▲ " : "▼ ") + fmt(Math.abs(d)) + '</span>';
      return '<div style="margin:6px 0 12px;--c:var(--' + (c.color || "gray") + ')"><div style="display:flex;gap:8px;align-items:center"><span>' + c.icon + ' ' + esc(c.name) + '</span><span class="spacer"></span>' + pill +
        '<b class="tnum">' + fmt(x.cents) + '</b></div><div class="bar-track"><div class="bar-fill" style="width:' + (x.cents / max * 100).toFixed(1) + '%"></div></div></div>'; }).join("")

// Swipe a timeline row: left past the threshold deletes (with Undo), right opens it for editing.
let suppressClick = false;
(function swipes(){
  const root = $("#tl"); let el = null, row = null, x0 = 0, y0 = 0, dx = 0, horiz = null;
  root.addEventListener("touchstart", e => { const s = e.target.closest(".swipe"); if (!s) return;
    el = s; row = s.querySelector(".li"); x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; horiz = null; }, { passive: true });
  root.addEventListener("touchmove", e => { if (!el) return;
    const x = e.touches[0].clientX - x0, y = e.touches[0].clientY - y0;
    if (horiz === null && Math.abs(x) + Math.abs(y) > 8) horiz = Math.abs(x) > Math.abs(y);
    if (!horiz) return;
    e.preventDefault(); dx = x; el.classList.add("dragging"); row.style.transform = "translateX(" + dx + "px)";
    if (Math.abs(dx) > 90 && !el.armed){ el.armed = true; haptic("light"); } else if (Math.abs(dx) <= 90) el.armed = false; }, { passive: false });
  root.addEventListener("touchend", () => { if (!el) return;
    const id = el.dataset.swipe, d = dx, wasHoriz = horiz; el.classList.remove("dragging"); row.style.transform = ""; el.armed = false; el = null;
    if (!wasHoriz) return;
    suppressClick = true; setTimeout(() => suppressClick = false, 400);
    if (d < -90) deleteWithUndo(id);
    else if (d > 90){ const tx = db.transactions.find(x => x.id === id); if (tx) txSheet({ tx }); } });
})();

  let k = kind || (tx ? txKind(tx) : prefill.cents > 0 ? "income" : "expense");

  let cat = tx ? tx.category : prefill.category || null, catPicked = !!(tx || prefill.category);

  let wid = tx ? tx.walletId : prefill.walletId || (db.wallets[0] && db.wallets[0].id), note = tx ? tx.note : prefill.note || "";

      (chips.length ? '<div class="chips">' + chips.map((m, i) => '<button class="chip" data-chip="' + i + '"><span class="g">' + category(db, m.category).icon + '</span>' + esc(m.note) + '</button>').join("") + '</div>' : "") +

function walletSheet(w){
  const editing = !!w;
  openSheet('<h2>' + (editing ? esc(w.name) : "New wallet") + '</h2>' +
    (editing ? '<div class="card" style="margin-bottom:14px"><div class="eyebrow">Balance today</div><div class="net">' + fmt(walletBalance(db, w.id), w.currency) + '</div></div>' : "") +
    '<label class="fld">Name<input id="w-name" maxlength="40" value="' + esc(w ? w.name : "") + '"></label>' +
    '<div class="grid2"><label class="fld">Currency<input id="w-cur" maxlength="3" value="' + (w ? w.currency : db.base) + '" style="text-transform:uppercase"></label>' +
    '<label class="fld">Kind<select id="w-kind">' + [["account", "Account"], ["cash", "Cash"], ["savings", "Savings"]].map(([k, l]) => '<option value="' + k + '"' + ((w ? w.kind : "cash") === k ? " selected" : "") + '>' + l + '</option>').join("") + '</select></label></div>' +
    (editing ? '<label class="fld">Set balance to (creates an adjustment that is not counted as spending)<input id="w-adj" inputmode="decimal" placeholder="' + (walletBalance(db, w.id) / 100).toFixed(2) + '"></label>' +
      '<label class="fld" style="flex-direction:row;align-items:center"><input id="w-hide" type="checkbox" style="width:auto"' + (w.hidden ? " checked" : "") + '> Hide from total balance</label>'
      : '<label class="fld">Starting balance<input id="w-start" inputmode="decimal" placeholder="0.00"></label>') +
    '<div class="btns">' + (editing ? '<button class="btn danger" id="w-del">Delete</button>' : '<button class="btn ghost" id="w-cancel">Cancel</button>') + '<button class="btn primary" id="w-save">Save</button></div>');
  if ($("#w-cancel")) $("#w-cancel").onclick = closeSheet;
  if ($("#w-del")) $("#w-del").onclick = () => {
    const n = db.transactions.filter(t => t.walletId === w.id).length;
    ask("Delete " + w.name + (n ? " and its " + n + " transactions" : "") + "?", "Delete wallet", () => delWallet(w));
  };
  function delWallet(w){
    const ids = new Set(db.transactions.filter(t => t.walletId === w.id).map(t => t.id));
    db.transactions.filter(t => ids.has(t.id) && t.linkedId).forEach(t => deleteTx(db, t.id));
    db.transactions = db.transactions.filter(t => t.walletId !== w.id);
    db.templates = db.templates.filter(t => t.walletId !== w.id && t.transferTo !== w.id);
    db.wallets = db.wallets.filter(x => x !== w); save(); render();
  }
  $("#w-save").onclick = () => {
    const name = $("#w-name").value.trim(), cur = $("#w-cur").value.trim().toUpperCase();
    if (!name){ toast("Name the wallet"); return; }
    if (!/^[A-Z]{3}$/.test(cur)){ toast("Currency must be a 3-letter code like EUR"); return; }
    if (editing){
      Object.assign(w, { name, currency: cur, kind: $("#w-kind").value, hidden: $("#w-hide").checked });
      if ($("#w-adj").value.trim()){ const c = toCents($("#w-adj").value); if (c != null) adjustBalance(db, w.id, c); }
    } else db.wallets.push({ id: uid(), name, currency: cur, kind: $("#w-kind").value, startingBalance: toCents($("#w-start").value) || 0, type: $("#w-kind").value === "cash" ? "cash" : "bank" });
    save(); closeSheet(); render();
  };
}

// Daily ECB rates for every currency the feed covers. Inside claude.ai the page can't reach other sites, so manual rates apply there.
async function refreshRates(force){
  if (!force && db.ratesChecked === today()) return;
  try {
    const r = await fetch("https://api.frankfurter.dev/v1/latest?base=" + encodeURIComponent(db.base), { cache: "no-store" });
    db.ratesChecked = today();
    if (r.ok && applyRates(db, await r.json())){ save(); render(); }
  } catch (e) {}
}

// Theme: follow the iPhone (default) -> always light -> always dark.
function applyTheme(t){
  if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  $("#theme-meta").textContent = t === "light" ? "Always Gruvbox light" : t === "dark" ? "Always Gruvbox dark" : "Follows your iPhone";
}
$("#m-theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme") || "", next = cur === "" ? "light" : cur === "light" ? "dark" : "";
  applyTheme(next); haptic("light");
  try { localStorage.setItem("tally.theme", next); } catch (e) {}
};
try { applyTheme(localStorage.getItem("tally.theme") || ""); } catch (e) { applyTheme(""); }

// Face ID lock lives in the app; the page only shows the switch.
if (nativeApp){
  $("#m-lock").hidden = false;
  $("#lock-toggle").checked = !(window.acornNative && window.acornNative.lock === false);
  $("#lock-toggle").onchange = e => { nativeApp.postMessage({ type: "lock", on: e.target.checked }); haptic("light"); };
}

// ---- categories ----
$("#m-categories").onclick = function catList(){
  const used = id => db.transactions.filter(t => t.category === id).length;
  const group = type => db.categories.filter(c => c.type === type).map(c => '<button class="li" data-ce="' + c.id + '" style="--c:var(--' + (c.color || "gray") + ')"><span class="ic">' + c.icon +
    '</span><span class="mid"><span class="ttl">' + esc(c.name) + (c.hidden ? ' <span class="pill">hidden</span>' : "") + '</span><span class="meta">' + used(c.id) + ' transactions</span></span></button>').join("");
  openSheet('<h2>Categories</h2><div class="eyebrow">Expenses</div><div class="rows">' + group("expense") + '</div>' +
    '<div class="eyebrow" style="margin-top:14px">Income</div><div class="rows">' + group("income") + '</div>' +
    '<div class="btns" style="margin-top:14px"><button class="btn ghost" id="i-cancel">Done</button><button class="btn primary" id="c-add">+ New category</button></div>');
  $$("[data-ce]").forEach(b => b.onclick = () => catEdit(db.categories.find(c => c.id === b.dataset.ce), catList));
  $("#c-add").onclick = () => catEdit(null, catList);
};
function catEdit(c, back){
  const isNew = !c, fallback = c && (c.id === "other" || c.id === "otherin"); // where unknown merchants land, so it can't be merged away
  let color = c ? c.color || "gray" : "yellow", type = c ? c.type : "expense";
  const draw = () => {
    const others = db.categories.filter(x => x.type === type && x.id !== (c && c.id));
    openSheet('<h2>' + (isNew ? "New category" : "Edit category") + '</h2>' +
      (isNew ? '<div class="seg">' + ["expense", "income"].map(x => '<button data-ct="' + x + '"' + (x === type ? ' class="on"' : "") + '>' + x.toUpperCase() + '</button>').join("") + '</div>' : "") +
      '<div class="grid2" style="grid-template-columns:76px minmax(0,1fr)"><label class="fld">Icon<input id="c-icon" maxlength="4" value="' + esc(c ? c.icon : "🌰") + '" style="text-align:center;font-size:22px;padding:8px"></label>' +
      '<label class="fld">Name<input id="c-name" maxlength="30" value="' + esc(c ? c.name : "") + '" placeholder="e.g. Pets"></label></div>' +
      '<div class="eyebrow" style="margin-bottom:6px">Colour</div><div class="swatches">' + COLORS.map(k => '<button data-sw="' + k + '" style="--c:var(--' + k + ')" aria-label="' + k + '"' + (k === color ? ' class="on"' : "") + '></button>').join("") + '</div>' +
      (isNew ? "" : '<label class="fld" style="flex-direction:row;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:13px"><input type="checkbox" id="c-hide" style="width:20px;height:20px;accent-color:var(--gold)"' + (c.hidden ? " checked" : "") + '> Hide when adding transactions</label>' +
        (fallback ? "" : '<label class="fld">Merge into<select id="c-merge"><option value="">Don\'t merge</option>' + others.map(o => '<option value="' + o.id + '">' + o.icon + ' ' + esc(o.name) + '</option>').join("") + '</select></label>')) +
      '<div class="btns"><button class="btn ghost" id="c-back">Back</button><button class="btn primary" id="c-save">Save</button></div>');
    $$("[data-ct]").forEach(b => b.onclick = () => { type = b.dataset.ct; draw(); });
    $$("[data-sw]").forEach(b => b.onclick = () => { color = b.dataset.sw; $$("[data-sw]").forEach(x => x.classList.toggle("on", x === b)); });
    $("#c-back").onclick = back;
    $("#c-save").onclick = () => {
      const name = $("#c-name").value.trim(), icon = $("#c-icon").value.trim() || "🌰";
      if (!name){ toast("Name the category"); return; }
      const target = $("#c-merge") && $("#c-merge").value;
      if (target){
        const n = db.transactions.filter(t => t.category === c.id).length, to = category(db, target);
        ask("Move " + n + " transactions from " + c.name + " to " + to.name + " and remove " + c.name + "?", "Merge", () => { mergeCategory(db, c.id, target); save(); render(); haptic("success"); back(); });
        return;
      }
      if (isNew) db.categories.push({ id: "c-" + uid(), name, icon, type, color });
      else Object.assign(c, { name, icon, color, hidden: $("#c-hide").checked });
      save(); render(); haptic("success"); back();
    };
  };
  draw();
}
$("#m-reset").onclick = () => ask("Erase all wallets and transactions" + (cloud ? " on every device" : " in this browser") + "? Back up first if unsure.", "Erase everything", () => {
  try { localStorage.removeItem(KEY); } catch (e) {}
  db = load(); save(); go("overview"); });

// ---- Apple Pay Shortcut capture ----
function handleHash(){
  const quick = /^#new-(expense|income|transfer)$/.exec(location.hash); // long-press icon shortcuts
  if (quick){ history.replaceState(null, "", location.pathname + location.search); txSheet({ kind: quick[1] }); return; }
  const cap = parseCaptureHash(location.hash); if (!cap) return;
  history.replaceState(null, "", location.pathname + location.search);
  const wid = captureWallet(db, cap);
  const g = guessCategory(db, cap.merchant, cap.cents);
  const fx = inWalletCurrency(db, cap.cents, cap.currency, wallet(db, wid));
  if (g.sure && wid){ // confident: log it without asking; the toast opens it for correction
    const tx = addTx(db, { walletId: wid, amount: fx.amount, original: fx.original, unconverted: fx.unconverted, category: g.category, date: today(), note: cap.merchant, source: "applepay" });
    if (cap.card && !db.cardMap[cap.card]) db.cardMap[cap.card] = wid;
    save(); go("timeline");
    toast("Logged " + fmt(fx.amount, wallet(db, wid).currency) + (fx.original ? " (" + fmt(fx.original.amount, fx.original.currency) + ")" : "") + " " + (cap.merchant || "") +
      " → " + category(db, g.category).name + ". Tap to change.", () => txSheet({ tx }));
    return;
  }
  txSheet({ prefill: { cents: fx.amount, walletId: wid, category: g.category, card: cap.card, source: "applepay",
    note: cap.merchant + (fx.original ? " (" + fmt(fx.original.amount, fx.original.currency) + ")" : "") } });
}
window.addEventListener("hashchange", handleHash);
// The iPhone app calls this with payments its Shortcuts action saved in the background.
window.tallyQueue = items => {
  const r = importQueued(db, Array.isArray(items) ? items : []);
  if (r.added){ save(); render();
    toast("Logged " + r.added + " Apple Pay payment" + (r.added > 1 ? "s" : "") + (r.unsure ? ". " + r.unsure + " filed under Other, tap to review." : "."), r.unsure ? () => go("timeline") : null); }
  if (r.ack.length && nativeApp) nativeApp.postMessage({ type: "ack", ids: r.ack }); // after save(), so the data file is written first
};

// ---- boot ----
if (materializeRecurring(db)) save();
go("overview");
handleHash();
startCloud().finally(() => refreshRates());
</script>
</body>
</html>
