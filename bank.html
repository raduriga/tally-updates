<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Back to Acorn</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, -apple-system, sans-serif;
         background: #f9f5d7; color: #3c3836; padding: 24px; box-sizing: border-box; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #1d2021; color: #ebdbb2; } a { color: #fabd2f; } }
  a { color: #b57614; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div style="font-size:48px">🌰</div>
  <p>Returning to Acorn…</p>
  <p><a id="back" href="acorn://bank">Tap here if Acorn doesn't open</a></p>
</main>
<script>
  // Enable Banking returns here with ?code=…&state=… (or ?error=…); hand it to the app. Nothing is stored or sent anywhere.
  var url = "acorn://bank" + location.search;
  document.getElementById("back").href = url;
  location.replace(url);
</script>
</body>
</html>
